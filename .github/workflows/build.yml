name: Build Prisma

on:
  push:
    branches: ['**', '!anteprime']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    # Non usare macos-latest: le code dei runner Apple Silicon gratuiti vanno in timeout.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6

      # Eve usa il modello Apple (FoundationModels), che si compila solo con l'SDK di macOS 26:
      # si sceglie l'Xcode 26 più recente installato sul runner (il predefinito è il 16).
      - name: Seleziona Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          XC="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$XC" ]; then
            echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
            echo "Uso $XC"
          else
            echo "Xcode 26 non trovato: Eve verrà compilata senza il modello Apple"
          fi

      - name: Strumenti disponibili
        run: |
          xcode-select -p
          echo "DEVELOPER_DIR=$DEVELOPER_DIR"
          swift --version
          xcrun --show-sdk-version

      - name: Compila (Apple Silicon + Intel)
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Genera AppIcon.icns
        run: |
          if [ -f Design/Icone/AppIcon.png ]; then
            ICONSET=AppIcon.iconset
            mkdir -p "$ICONSET"
            for s in 16 32 128 256 512; do
              sips -z $s $s Design/Icone/AppIcon.png --out "$ICONSET/icon_${s}x${s}.png" > /dev/null
              d=$((s * 2))
              sips -z $d $d Design/Icone/AppIcon.png --out "$ICONSET/icon_${s}x${s}@2x.png" > /dev/null
            done
            iconutil -c icns "$ICONSET" -o AppIcon.icns
            ls -la AppIcon.icns
          else
            echo "Design/Icone/AppIcon.png assente: nessuna icona"
          fi

      - name: Crea Prisma.app
        run: |
          BIN_DIR="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)"
          APP=Prisma.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "$BIN_DIR/Prisma" "$APP/Contents/MacOS/Prisma"
          cp Info.plist "$APP/Contents/Info.plist"
          if [ -f AppIcon.icns ]; then
            cp AppIcon.icns "$APP/Contents/Resources/"
            /usr/libexec/PlistBuddy -c "Add :CFBundleIconFile string AppIcon" "$APP/Contents/Info.plist"
          fi
          # Bundle delle risorse SwiftPM: va in Contents/Resources (non nella
          # radice del .app, che romperebbe la firma).
          for b in "$BIN_DIR"/*.bundle; do
            [ -e "$b" ] || continue
            echo "Copio $(basename "$b")"
            ditto "$b" "$APP/Contents/Resources/$(basename "$b")"
          done
          # Istruzioni di Eve: vivono in Eve/Istruzioni e si leggono dal pacchetto
          if [ -d Eve/Istruzioni ]; then
            mkdir -p "$APP/Contents/Resources/Eve"
            ditto Eve/Istruzioni "$APP/Contents/Resources/Eve/Istruzioni"
          fi
          codesign --force --deep --sign - "$APP"

      - name: Verifica Prisma.app
        run: |
          APP=Prisma.app
          set -e
          test -x "$APP/Contents/MacOS/Prisma"
          lipo -info "$APP/Contents/MacOS/Prisma" | tee /dev/stderr | grep -q arm64
          lipo -info "$APP/Contents/MacOS/Prisma" | grep -q x86_64
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")" = Prisma
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = local.prisma
          if [ -f Design/Icone/AppIcon.png ]; then
            test -f "$APP/Contents/Resources/AppIcon.icns"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$APP/Contents/Info.plist")" = AppIcon
          fi
          if [ -d Sources/Prisma/Risorse ]; then
            BUNDLE="$APP/Contents/Resources/Prisma_Prisma.bundle"
            test -d "$BUNDLE"
            # Su macOS il bundle SwiftPM ha la struttura Contents/Resources
            RIS="$BUNDLE/Contents/Resources/Risorse"
            [ -d "$RIS" ] || { echo "Struttura inattesa del bundle:"; find "$BUNDLE" | head -40; exit 1; }
            ( cd Sources/Prisma/Risorse && find . -type f ! -name '.*' ) | while read -r f; do
              test -f "$RIS/$f" || { echo "Manca Risorse/$f nel .app"; exit 1; }
            done
            # Controllo a runtime: l'app deve trovare le risorse dal .app
            "$APP/Contents/MacOS/Prisma" --verifica-risorse
          fi
          # Prova reale di backup, rotazione e ripristino in cartelle temporanee
          "$APP/Contents/MacOS/Prisma" --prova-backup
          # Prova dei motori di calcolo contro risultati calcolati a parte
          "$APP/Contents/MacOS/Prisma" --prova-calcoli
          # Prova di Eve: istruzioni, scheda del cliente, sintesi dai dati
          test -f "$APP/Contents/Resources/Eve/Istruzioni/chat.md"
          test -f "$APP/Contents/Resources/Eve/Istruzioni/commento.md"
          "$APP/Contents/MacOS/Prisma" --prova-eve
          # Prova dei prospetti: cifre, impaginazione A4 e PDF
          "$APP/Contents/MacOS/Prisma" --prova-prospetti
          # Prova di carico: 200 clienti, velocità e memoria (il Mac dell'utente ha 8 GB)
          "$APP/Contents/MacOS/Prisma" --prova-carico
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "Prisma.app verificata"

      # Facoltative: se nessun metodo di disegno funziona sul runner, la build resta verde.
      - name: Anteprime (istantanee delle schermate)
        id: anteprime
        run: |
          for metodo in finestra livello renderer; do
            rm -rf anteprime && mkdir anteprime
            if "Prisma.app/Contents/MacOS/Prisma" --istantanee "$PWD/anteprime" --metodo "$metodo"; then
              echo "Anteprime create con il metodo $metodo"
              echo "ok=1" >> "$GITHUB_OUTPUT"
              "Prisma.app/Contents/MacOS/Prisma" --prova-prospetti "$PWD/anteprime/prospetti" > /dev/null || true
              # Alcune schermate con il testo «molto grande» (Impostazioni → Dimensione del testo)
              "Prisma.app/Contents/MacOS/Prisma" --istantanee "$PWD/anteprime/testo-grande" --metodo "$metodo" --testo 1.2 \
                --solo 1-scrivania,5-clienti-panoramica,8-posizioni-dettaglio,11-agenda,65-portafoglio > /dev/null || true
              ls -la anteprime anteprime/prospetti || true
              break
            fi
            echo "Metodo $metodo non riuscito"
          done

      - name: Pubblica le anteprime sul branch anteprime
        if: github.event_name == 'push' && steps.anteprime.outputs.ok == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd anteprime
          printf 'branch: %s\ncommit: %s\ndata: %s\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" "$(date -u +%FT%TZ)" > INFO.txt
          git init -q -b anteprime
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Anteprime di $GITHUB_SHA"
          # Due build che finiscono insieme (main appena unito e il branch) si contendono il ref: si riprova
          for tentativo in 1 2 3; do
            git push -fq "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" anteprime && exit 0
            echo "Pubblicazione non riuscita (tentativo $tentativo), riprovo"
            sleep $((tentativo * 10))
          done
          exit 1

      - name: Crea zip
        run: ditto -c -k --keepParent Prisma.app Prisma.zip

      - uses: actions/upload-artifact@v6
        with:
          name: Prisma
          path: Prisma.zip
          retention-days: 7
