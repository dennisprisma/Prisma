<!doctype html>
<!--
  Prisma · Liquid Glass — template grafico
  Stessa struttura di Prisma OS (barra superiore, scrivania con i 6 widget, dock con le 16 app,
  finestre interne), ridisegnata con il materiale "vetro liquido" di Apple.
  File autonomo: nessuna risorsa esterna, nessuna libreria. Dati dimostrativi (i 5 clienti del template).
  Rifrazione dei bordi: attiva solo nei browser Chromium; in Safari resta il vetro sfocato.
-->
<html lang="it" data-scheme="light" data-glass="clear" data-wall="acqua" data-icons="color" data-labels="0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prisma · Liquid Glass</title>
<script>
/* Applica subito l'aspetto salvato, prima del primo disegno. */
(function () {
  var s = {};
  try { s = JSON.parse(localStorage.getItem('prisma-lg:settings') || '{}') || {}; } catch (e) {}
  var d = document.documentElement, scheme = s.scheme || 'auto';
  var dark = scheme === 'dark' || (scheme === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  d.setAttribute('data-scheme', dark ? 'dark' : 'light');
  d.setAttribute('data-glass', s.glass || 'clear');
  var walls = ['acqua', 'laguna', 'ardesia', 'gocce', 'prisma'];
  d.setAttribute('data-wall', walls.indexOf(s.wall) >= 0 ? s.wall : 'acqua');
  d.setAttribute('data-icons', s.icons || 'color');
  d.setAttribute('data-labels', s.labels ? '1' : '0');
})();
</script>
<style>
/* =========================================================
   1. Gettoni: misure, caratteri, colori per aspetto e vetro
   ========================================================= */

  --wpp1: rgba(255, 255, 255, .8); --wpp2: rgba(190, 210, 230, .28); --wpedge: rgba(255, 255, 255, .95); --wpshadow: rgba(30, 60, 90, .22);
  --lg1: #9CC9CF; --lg2: #A9BFDB; --lg3: #BFDCD4; --lg4: #EEF6F9; --lg5: #EDF4F7; --lg6: #C6DCE6; --lg-line: rgba(255, 255, 255, .35);

  --gc1: #B4DDF6; --gc2: #5E9BD0;
}

  --g-blur: 30px; --g-sat: 1.2; --g-bright: 1.03;
  --chip: rgba(255, 255, 255, .62);
  --win-fill: rgba(247, 247, 251, .94);
  --side-fill: rgba(255, 255, 255, .66);
}
html[data-scheme="dark"] {
  color-scheme: dark;
  --accent: #0A84FF; --link: #8CC4FF;
  --ch-a: #5B8CFF; --ch-i: #BF8430;
  --wall-ink: #fff; --wall-ink-2: rgba(255, 255, 255, .68); --wall-glow: 0 1px 12px rgba(0, 0, 0, .35);
  --bar-shade: rgba(0, 0, 0, .3);
  --ink: rgba(255, 255, 255, .94); --ink-2: rgba(255, 255, 255, .64); --ink-3: rgba(255, 255, 255, .42);
  --sep: rgba(255, 255, 255, .1);
  --g-fill: rgba(12, 26, 36, .42); --g-thin: rgba(16, 32, 44, .3); --g-panel: rgba(14, 28, 38, .7);
  --g-blur: 14px; --g-sat: 1.25; --g-bright: .9;
  --g-hi: rgba(255, 255, 255, .42); --g-lo: rgba(255, 255, 255, .1); --g-edge: rgba(255, 255, 255, .18); --g-inner: rgba(255, 255, 255, .05);
  --g-sheen: rgba(255, 255, 255, .13);
  --g-shadow: 0 26px 52px -24px rgba(0, 0, 0, .7), 0 4px 14px -4px rgba(0, 0, 0, .35);
  --rim-a: rgba(255, 255, 255, .72); --rim-b: rgba(255, 255, 255, .3);
  --fringe: 1; --rim-c: rgba(150, 205, 230, .32);

  --card: rgba(255, 255, 255, .06); --card-edge: rgba(255, 255, 255, .08);
  --row-h: rgba(255, 255, 255, .05);
  --win-fill: rgba(18, 29, 38, .88); --win-solid: rgba(18, 29, 38, .97);
  --side-fill: rgba(255, 255, 255, .07);
  --thumb: rgba(255, 255, 255, .26);
  --dt-bg: rgba(255, 255, 255, .12);
  --scrim: rgba(0, 10, 18, .34);
  --tip-bg: rgba(22, 38, 50, .76);
  --lk-ink: #fff;
  /* sfondo Prisma, scuro */
  --wp1: #0C1A24; --wp2: #10222F; --wp3: #081219;

  --lg1: #1D5960; --lg2: #233F66; --lg3: #1B4A44; --lg4: #1E3F58; --lg5: #071C27; --lg6: #04121A; --lg-line: rgba(255, 255, 255, .05);

  --aq1: #0E2533; --aq2: #123648; --aq3: #081A25; --aqh1: rgba(110, 170, 205, .28); --aqh2: rgba(20, 90, 120, .35); --aqc: .13; --aqs: rgba(160, 215, 240, .18);
  --gc1: #15385A; --gc2: #06121F;

  --g-blur: 30px; --g-sat: 1.15; --g-bright: .86;

  html[data-scheme="dark"][data-glass] { --g-fill: rgba(28, 29, 40, .96); --g-thin: rgba(28, 29, 40, .94); --g-panel: rgba(28, 29, 40, .98); --win-fill: rgba(28, 29, 40, .99); }
}

/* =========================================================
   2. Base
   ========================================================= */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  font: 13px/1.4 var(--font); color: var(--ink); background: var(--wp1);
  overflow: hidden; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  -webkit-user-select: none; user-select: none;
}
input, textarea { -webkit-user-select: text; user-select: text; }
/* colore del testo dichiarato sui contenitori principali: resta corretto anche cambiando aspetto al volo */
.desk, .win, .win-grid, .main, .side, .pad, .widget, .dock, .tip, .spot, .nc, .cc, .pop, .switcher, .toast, .chat, .msg, .bub, .group, .card { color: var(--ink); }
button { font: inherit; color: inherit; cursor: default; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
kbd { font: 500 11px/1 var(--font); color: var(--ink-2); padding: 3px 6px; border-radius: 6px; background: var(--well); }
svg { display: block; }
.defs { position: absolute; width: 0; height: 0; overflow: hidden; }
* { scrollbar-width: thin; scrollbar-color: var(--well-2) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--well-2); border-radius: 10px; border: 3px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }

/* =========================================================
   3. Sfondi
   ========================================================= */
.wall { position: fixed; inset: 0; z-index: 0; overflow: hidden; transform: translateZ(0); background: var(--wp1); }
.wp { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
html[data-wall="prisma"] .wp-prisma, html[data-wall="laguna"] .wp-laguna, html[data-wall="acqua"] .wp-acqua,
html[data-wall="ardesia"] .wp-ardesia, html[data-wall="gocce"] .wp-gocce { display: block; }
.wp-acqua .a1 { stop-color: var(--aq1); } .wp-acqua .a2 { stop-color: var(--aq2); } .wp-acqua .a3 { stop-color: var(--aq3); }
.wp-acqua .ah1 { fill: var(--aqh1); } .wp-acqua .ah2 { fill: var(--aqh2); }
.wp-acqua .ac { fill: #fff; opacity: var(--aqc); }
.wp-acqua .as { stop-color: var(--aqs); }
.wp-prisma .s1 { stop-color: var(--wp1); } .wp-prisma .s2 { stop-color: var(--wp2); } .wp-prisma .s3 { stop-color: var(--wp3); }
.wp-prisma .hz1 { fill: var(--wph1); } .wp-prisma .hz2 { fill: var(--wph2); } .wp-prisma .hz3 { fill: var(--wph3); }
.wp-prisma .bm { stop-color: var(--wpbeam); }
.wp-prisma .fan { mix-blend-mode: var(--wpfan-blend); opacity: var(--wpfan-o); }
.wp-prisma .f1 { fill: var(--f1); } .wp-prisma .f2 { fill: var(--f2); } .wp-prisma .f3 { fill: var(--f3); }
.wp-prisma .f4 { fill: var(--f4); } .wp-prisma .f5 { fill: var(--f5); } .wp-prisma .f6 { fill: var(--f6); }
.wp-prisma .p1 { stop-color: var(--wpp1); } .wp-prisma .p2 { stop-color: var(--wpp2); }
.wp-prisma .pr-edge { fill: none; stroke: var(--wpedge); stroke-width: 2.4; stroke-linejoin: round; }
.wp-prisma .pr-ridge { stroke: var(--wpedge); stroke-opacity: .45; stroke-width: 1.4; }
.wp-prisma .pr-path { stroke: var(--wpbeam); stroke-opacity: .5; stroke-width: 3; }
.wp-prisma .sh { flood-color: var(--wpshadow); }
.bg-laguna {
  background:
    repeating-radial-gradient(circle at 30% 125%, transparent 0 26px, var(--lg-line) 27px 28px, transparent 29px 58px),
    radial-gradient(60% 55% at 15% 75%, var(--lg1) 0%, transparent 62%),
    radial-gradient(55% 50% at 85% 25%, var(--lg2) 0%, transparent 60%),
    radial-gradient(45% 40% at 60% 95%, var(--lg3) 0%, transparent 60%),
    radial-gradient(40% 35% at 40% 12%, var(--lg4) 0%, transparent 60%),
    linear-gradient(170deg, var(--lg5), var(--lg6));
}
.bg-ardesia {
  background:
    radial-gradient(70% 55% at 22% 18%, var(--sl3) 0%, transparent 65%),
    radial-gradient(60% 50% at 85% 90%, var(--sl4) 0%, transparent 65%),
    linear-gradient(165deg, var(--sl1), var(--sl2));
}
.bg-acqua { background: linear-gradient(160deg, var(--aq1), var(--aq2) 55%, var(--aq3)); }
.bg-gocce { background: linear-gradient(165deg, var(--gc1), var(--gc2)); }
.bg-gocce svg { width: 100%; height: 100%; }

/* =========================================================
   4. Il materiale: vetro liquido
   ========================================================= */
.glass {
  position: relative; isolation: isolate;
  border-radius: var(--r, 22px);
  background:
    radial-gradient(130% 90% at var(--mx, 25%) var(--my, -20%), var(--g-sheen), transparent 52%),
    linear-gradient(var(--g-tint, transparent), var(--g-tint, transparent)),
    var(--g-fill);
  -webkit-backdrop-filter: blur(var(--g-blur)) saturate(var(--g-sat)) brightness(var(--g-bright));
  backdrop-filter: var(--g-filter, blur(var(--g-blur)) saturate(var(--g-sat)) brightness(var(--g-bright)));
  box-shadow:
    var(--g-shadow),
    inset 0 0 0 .5px var(--g-edge),
    inset 0 1px 0 var(--g-hi),
    inset 0 -1px 0 var(--g-lo),
    inset 0 0 24px var(--g-inner);
}
.glass.thin {
  --g-fill: var(--g-thin);
  -webkit-backdrop-filter: blur(calc(var(--g-blur) * .5)) saturate(var(--g-sat)) brightness(var(--g-bright));
  backdrop-filter: var(--g-filter, blur(calc(var(--g-blur) * .5)) saturate(var(--g-sat)) brightness(var(--g-bright)));
}
.glass.panel { --g-fill: var(--g-panel); }
/* filo di luce sul bordo */
.glass::before, .glass::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 3;
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
}
.glass::before {
  padding: 1px;
  background: linear-gradient(135deg, var(--rim-a) 0%, rgba(255, 255, 255, .2) 22%, rgba(255, 255, 255, 0) 45%,
              rgba(255, 255, 255, 0) 62%, rgba(255, 255, 255, .16) 80%, var(--rim-b) 100%);
}
/* la luce che rientra dal bordo inferiore, come nel vetro vero */
.glass::after {
  padding: 1px;
  background: linear-gradient(180deg, transparent 0%, transparent 58%, var(--rim-c) 100%);
  opacity: var(--fringe);
}

/* =========================================================
   5. Componenti comuni
   ========================================================= */
.btn {
  display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 14px; border: 0; border-radius: 999px;
  font: 500 13px/1 var(--font); color: var(--ink); background: var(--chip); white-space: nowrap;
  box-shadow: inset 0 0 0 .5px var(--chip-edge), inset 0 1px 0 var(--g-hi), 0 1px 2px rgba(0, 0, 0, .08);
  transition: transform .35s var(--spring), background .15s;
}
.btn:hover { background: var(--chip-h); }
.btn:active { transform: scale(.96); }
.btn.sm { height: 28px; padding: 0 12px; font-size: 12.5px; }
.btn.primary { background: var(--accent); color: #fff; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), 0 3px 10px -3px color-mix(in srgb, var(--accent) 70%, transparent); }
.btn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, #fff); }
.gbtn {
  --r: 999px; display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 15px; border: 0;
  color: var(--ink); font-size: 13px; font-weight: 500; white-space: nowrap; transition: transform .35s var(--spring);
}
.gbtn > * { position: relative; z-index: 4; }
.gbtn:hover { --g-tint: rgba(255, 255, 255, .14); }
.gbtn:active { transform: scale(.96); }
.gbtn svg { width: 15px; height: 15px; }
.gbtn.sm { height: 30px; padding: 0 13px; font-size: 12.5px; }

.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px 0 8px; border-radius: 999px; flex: none;
  font-size: 11.5px; font-weight: 600; color: var(--ink); white-space: nowrap;
  background: var(--chip); box-shadow: inset 0 0 0 .5px var(--chip-edge), inset 0 1px 0 var(--g-hi);
}
.chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 .5px rgba(255, 255, 255, .4); }
.chip.ch-a { --c: var(--ch-a); background: color-mix(in srgb, var(--ch-a) 17%, var(--chip)); }
.chip.ch-i { --c: var(--ch-i); background: color-mix(in srgb, var(--ch-i) 19%, var(--chip)); }
.chip.sm { height: 20px; font-size: 11px; padding: 0 8px 0 7px; }

.av {
  --sz: 32px; width: var(--sz); height: var(--sz); flex: none; border-radius: 50%; display: grid; place-items: center;
  font: 600 calc(var(--sz) * .37)/1 var(--font-r); color: #fff; letter-spacing: .01em;
  background: radial-gradient(120% 120% at 30% 18%, var(--t1), var(--t2));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), inset 0 -1px 2px rgba(0, 0, 0, .15), 0 2px 6px -2px rgba(0, 0, 0, .35);
  text-shadow: 0 1px 1px rgba(0, 0, 0, .2);
}
.orb {
  --sz: 36px; position: relative; flex: none; width: var(--sz); height: var(--sz); border-radius: 50%; overflow: hidden;
  box-shadow: inset 0 0 0 .5px rgba(255, 255, 255, .55), 0 0 calc(var(--sz) * .45) calc(var(--sz) * -.14) rgba(40, 140, 200, .55);
}
.orb::before {
  content: ""; position: absolute; inset: -25%;
  background: conic-gradient(from 0deg, #1E5B8C, #3FA3D6, #A9E2F5, #2C7FB8, #5CC2E0, #1E5B8C);
  filter: blur(calc(var(--sz) * .12));
}
.orb::after {
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: radial-gradient(circle at 34% 27%, rgba(255, 255, 255, .9) 0 7%, rgba(255, 255, 255, 0) 32%),
              radial-gradient(circle at 50% 125%, rgba(0, 30, 50, .45), transparent 62%);
}
.w-eve:hover .orb::before, .eve-ctx .orb::before { animation: spin 6s linear infinite; }
@keyframes spin { to { transform: rotate(1turn); } }

.dt {
  width: 40px; height: 44px; flex: none; border-radius: 11px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  background: var(--dt-bg); box-shadow: inset 0 0 0 .5px var(--chip-edge), 0 1px 3px rgba(0, 0, 0, .08);
}
.dt small { font-size: 9.5px; font-weight: 700; color: var(--red); text-transform: uppercase; letter-spacing: .04em; line-height: 1; }
.dt span { font: 600 17px/1 var(--font-r); color: var(--ink); }

.segc {
  position: relative; display: inline-flex; flex: none; padding: 2px; border-radius: 999px;
  background: var(--well); box-shadow: inset 0 0 0 .5px var(--sep);
}
.segc button { position: relative; z-index: 1; border: 0; background: none; font: 500 12.5px/1 var(--font); color: var(--ink); padding: 7px 12px; border-radius: 999px; white-space: nowrap; }
.segc button[aria-checked="true"] { font-weight: 600; }
.segc .thumb {
  position: absolute; top: 2px; bottom: 2px; left: var(--x, 2px); width: var(--w, 0px); border-radius: 999px; background: var(--thumb);
  box-shadow: 0 1px 4px rgba(0, 0, 0, .18), inset 0 0 0 .5px var(--chip-edge), inset 0 1px 0 var(--g-hi);
}
.segc.ready .thumb { transition: left .38s var(--spring), width .38s var(--spring); }

.tg {
  position: relative; width: 44px; height: 26px; flex: none; border: 0; padding: 0; border-radius: 999px;
  background: var(--well-2); transition: background .25s;
}
.tg::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 999px; background: #fff;
  box-shadow: 0 2px 5px rgba(0, 0, 0, .22), 0 0 0 .5px rgba(0, 0, 0, .05);
  transition: transform .35s var(--spring), width .2s var(--out);
}
.tg[aria-checked="true"] { background: var(--green); }
.tg[aria-checked="true"]::after { transform: translateX(18px); }
.tg:active::after { width: 28px; }
.tg[aria-checked="true"]:active::after { transform: translateX(12px); }

.field {
  display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 999px;
  background: var(--well); box-shadow: inset 0 0 0 .5px var(--sep), inset 0 1px 2px rgba(0, 0, 0, .05);
}
.field input { flex: 1; min-width: 0; border: 0; background: none; font: inherit; color: var(--ink); outline: none; }
.field input::placeholder { color: var(--ink-3); }
.field svg { width: 14px; height: 14px; color: var(--ink-3); flex: none; }
.field.big { height: 44px; padding: 0 16px; margin-bottom: 14px; }
.field.big input { font-size: 16px; }
.field.big svg { width: 18px; height: 18px; }
.field.sm { height: 30px; width: 180px; }
.pill { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.pill.ok { background: color-mix(in srgb, var(--green) 18%, transparent); color: color-mix(in srgb, var(--green) 62%, var(--ink)); }
.pill.prop { background: color-mix(in srgb, var(--orange) 20%, transparent); color: color-mix(in srgb, var(--orange) 60%, var(--ink)); }
.pill.mute { background: var(--well); color: var(--ink-2); }
.due-soon { color: color-mix(in srgb, var(--orange) 72%, var(--ink)); font-weight: 600; }
.due-now { color: color-mix(in srgb, var(--red) 80%, var(--ink)); font-weight: 600; }
.chev { width: 7px; height: 12px; color: var(--ink-3); flex: none; }
.chev-d { width: 11px; height: 8px; flex: none; }

/* =========================================================
   6. Barra superiore
   ========================================================= */
.bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 80; height: var(--bar-h);
  display: flex; align-items: center; gap: 4px; padding: 0 8px 0 10px; color: var(--wall-ink); font-size: 13px;
}
.bar::before { content: ""; position: absolute; inset: 0 0 -12px 0; z-index: -1; background: linear-gradient(var(--bar-shade), transparent); pointer-events: none; }
.bar-brand, .bar-app {
  display: flex; align-items: center; gap: 7px; height: 26px; padding: 0 10px; border: 0; background: none; border-radius: 999px;
  color: inherit; text-shadow: var(--wall-glow); white-space: nowrap;
}
.bar-brand { font-weight: 700; letter-spacing: -.01em; padding-left: 6px; }
.bar-brand svg { width: 19px; height: 19px; }
.bar-app { font-weight: 500; }
.bar-brand:hover, .bar-app:hover { background: var(--chip); }
.bar-clock {
  position: absolute; left: 50%; translate: -50% 0; display: flex; gap: 9px; font-weight: 500;
  font-variant-numeric: tabular-nums; text-shadow: var(--wall-glow); white-space: nowrap; pointer-events: none;
}
.bar-tools { --r: 999px; margin-left: auto; display: flex; align-items: center; gap: 1px; padding: 2px; height: 30px; }
.bar-tools button {
  position: relative; z-index: 4; height: 26px; min-width: 28px; padding: 0 8px; border: 0; border-radius: 999px; background: none;
  color: var(--ink); display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 12.5px; font-weight: 500;
}
.bar-tools button:hover { background: var(--chip); }
.bar-tools svg { width: 16px; height: 16px; }
.bar-tools kbd { padding: 2px 5px; font-size: 10.5px; }
.badge {
  position: absolute; top: 0; right: 0; min-width: 15px; height: 15px; padding: 0 4px; border-radius: 999px;
  background: var(--red); color: #fff; font: 700 9.5px/15px var(--font); text-align: center; box-shadow: 0 0 0 1.5px rgba(255, 255, 255, .75);
}
.badge:empty { display: none; }
.me {
  width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; flex: none;
  font: 700 10px/1 var(--font-r); color: #fff; background: radial-gradient(circle at 30% 25%, #8FB3CF, #36607F);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), 0 1px 3px rgba(0, 0, 0, .25);
}
.me.big { width: 44px; height: 44px; font-size: 16px; }

/* =========================================================
   7. Scrivania e widget
   ========================================================= */
.desk { position: fixed; z-index: 10; inset: var(--bar-h) 0 0 0; overflow: auto; padding: 8px var(--gut) var(--dock-space); outline: none; }
.desk-in { max-width: 1480px; min-height: 100%; margin: 0 auto; display: flex; flex-direction: column; }
.hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px 24px; flex-wrap: wrap; padding: 14px 2px 0; }
.hero h1 { font: 700 34px/1.08 var(--font-d); letter-spacing: -.024em; color: var(--wall-ink); text-shadow: var(--wall-glow); }
.hero p { margin-top: 5px; font-size: 15px; color: var(--wall-ink-2); text-shadow: var(--wall-glow); }
.quick { display: flex; flex-wrap: wrap; gap: 8px; }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 20px 2px 10px; }
.sec-head h2 { font: 700 19px/1.2 var(--font-d); letter-spacing: -.012em; color: var(--wall-ink); text-shadow: var(--wall-glow); }
.board {
  flex: 1 1 auto; min-height: 520px; display: grid; gap: 12px;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  grid-template-rows: minmax(0, 1fr) 64px minmax(0, 1.04fr);
  grid-template-areas: "ag ag ag cl cl cl" "ag ag ag ev ev ev" "td td sc sc pf pf";
}
.foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 12px 4px 4px; font-size: 12px; color: var(--wall-ink-2); text-shadow: var(--wall-glow); }

.widget { --r: var(--r-w); min-width: 0; min-height: 0; padding: 14px; display: flex; flex-direction: column; container: w / size; }
.widget > * { position: relative; z-index: 1; }
html[data-scheme="dark"][data-glass="clear"] .widget { text-shadow: 0 1px 2px rgba(0, 0, 0, .28); }
.w-head { display: flex; align-items: center; gap: 8px; min-height: 26px; margin-bottom: 8px; flex: none; }
.w-head h2 { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.w-head h2 .ic { --sz: 20px; }
.w-link {
  margin-left: auto; flex: none; height: 26px; padding: 0 11px; border: 0; border-radius: 999px; background: var(--chip);
  box-shadow: inset 0 0 0 .5px var(--chip-edge); color: var(--link); font-size: 12px; font-weight: 600; text-shadow: none;
}
.w-link:hover { background: var(--chip-h); }
.w-scroll {
  flex: 1; min-height: 0; overflow: auto; margin: 0 -6px; padding: 0 6px 6px;
  -webkit-mask-image: linear-gradient(#000 calc(100% - 16px), transparent); mask-image: linear-gradient(#000 calc(100% - 16px), transparent);
}
.w-empty { font-size: 12.5px; color: var(--ink-2); padding: 10px 8px; }
.row {
  display: flex; align-items: center; gap: 11px; width: 100%; padding: 8px; border: 0; border-radius: 14px;
  background: none; text-align: left; color: var(--ink); text-shadow: inherit;
}
button.row:hover, .row-open:hover { background: var(--chip); }
.meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.meta b { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta > span { font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side-r { flex: none; text-align: right; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.side-r b { display: block; color: var(--ink); font-weight: 600; }

/* Agenda */
.w-agenda { grid-area: ag; flex-direction: row; gap: 14px; }
.wa-day { width: 148px; flex: none; display: flex; flex-direction: column; padding: 4px 12px 6px 4px; border-right: .5px solid var(--sep); }
.wa-wd { color: var(--red); font-weight: 600; font-size: 14px; text-transform: capitalize; text-shadow: none; }
.wa-num { font: 300 70px/1 var(--font-d); letter-spacing: -.045em; margin: 6px 0 2px -2px; }
.wa-mon { font-size: 14px; color: var(--ink-2); }
.wa-sum { margin-top: auto; font-size: 12px; color: var(--ink-2); }
.wa-sum b { display: block; color: var(--ink); font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.wa-list { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ev-tag { width: 4px; align-self: stretch; border-radius: 4px; background: var(--c); flex: none; margin: 2px 0; }
@container w (max-width: 430px) { .wa-day { width: 96px; padding-right: 8px; } .wa-num { font-size: 50px; } }

/* Cliente in primo piano */
.w-cliente { grid-area: cl; overflow: hidden; }
.w-cliente > .wc-wash {
  position: absolute; z-index: 0; inset: 0 0 auto 0; height: 120px; border-radius: inherit; pointer-events: none;
  background: linear-gradient(180deg, color-mix(in srgb, var(--t2) 10%, transparent), transparent);
}
.wc-head { display: flex; align-items: center; gap: 12px; flex: none; }
.wc-id { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; }
.wc-kicker { font-size: 11.5px; color: var(--ink-2); font-weight: 500; }
.wc-name {
  display: inline-flex; align-items: center; gap: 7px; max-width: 100%; border: 0; background: none; padding: 1px 8px 1px 0; border-radius: 8px;
  font: 700 18px/1.25 var(--font-d); letter-spacing: -.015em; color: var(--ink); text-shadow: inherit;
}
.wc-name:hover { background: var(--chip); padding-left: 6px; margin-left: -6px; }
.wc-tema { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.wc-ch { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; flex: none; }
.kpis {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 12px; margin-top: 12px; padding: 11px 14px; flex: none;
  border-radius: 16px; background: var(--chip); box-shadow: inset 0 0 0 .5px var(--chip-edge), inset 0 1px 0 var(--g-hi);
}
.kpi span { display: block; font-size: 11.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi b { display: block; margin-top: 2px; font: 600 16px/1.2 var(--font-d); letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wc-note { margin-top: 10px; font-size: 12.5px; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; flex: none; }
.wc-actions { margin-top: auto; padding-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; text-shadow: none; }
.eve-btn .orb { --sz: 16px; }
@container w (max-height: 256px) { .wc-note { display: none; } }
@container w (max-height: 200px) { .kpis .k2 { display: none; } }
@container w (max-height: 150px) { .wc-actions { display: none; } }

/* Eve */
.w-eve { grid-area: ev; --r: 22px; flex-direction: row; align-items: center; gap: 12px; padding: 0 16px 0 12px; border: 0; text-align: left; color: var(--ink); }
.w-eve .orb { --sz: 38px; }
.we-t { flex: 1; min-width: 0; }
.we-t b { display: block; font-size: 14px; font-weight: 600; }
.we-t span { display: block; font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Da fare */
.w-todo { grid-area: td; }
.todo { display: flex; align-items: center; gap: 8px; padding: 2px 4px 2px 8px; border-radius: 14px; }
.row-open { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 6px 6px; border: 0; border-radius: 12px; background: none; text-align: left; color: var(--ink); text-shadow: inherit; }
.ck {
  width: 22px; height: 22px; border-radius: 50%; flex: none; border: 0; padding: 0; display: grid; place-items: center;
  background: var(--chip); box-shadow: inset 0 0 0 1.5px var(--well-2);
  transition: background .2s, box-shadow .2s, transform .3s var(--spring);
}
.ck svg { width: 12px; height: 12px; color: #fff; opacity: 0; transform: scale(.5); transition: .28s var(--spring); }
.ck[aria-checked="true"] { background: var(--green); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .4), 0 2px 6px -2px rgba(52, 199, 89, .6); }
.ck[aria-checked="true"] svg { opacity: 1; transform: none; }
.ck:active { transform: scale(.88); }
.todo.done .meta b { text-decoration: line-through; color: var(--ink-3); }
.todo.sel { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.flag { width: 12px; height: 12px; color: var(--orange); flex: none; }
.flag svg { width: 12px; height: 12px; }

/* Scadenze */
.w-scad { grid-area: sc; }

/* Portafoglio */
.w-port { grid-area: pf; }
.pf-total { font: 700 30px/1.05 var(--font-d); letter-spacing: -.025em; margin-top: 2px; flex: none; }
.pf-cap { font-size: 12px; color: var(--ink-2); margin-top: 4px; flex: none; }
.split { display: flex; gap: 2px; height: 10px; margin: 14px 0 10px; flex: none; }
.split span { border-radius: 4px; min-width: 6px; background: var(--c); }
.legend { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; flex: none; }
.legend li { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto 38px; align-items: center; gap: 8px; font-size: 12.5px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.legend b { font-weight: 600; font-variant-numeric: tabular-nums; }
.legend em { font-style: normal; color: var(--ink-2); text-align: right; font-variant-numeric: tabular-nums; }
.pf-prop { margin-top: auto; padding-top: 10px; display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; border-top: .5px solid var(--sep); flex: none; }
.pf-prop span { color: var(--ink-2); }
.pf-prop b { font-weight: 600; }
@container w (max-height: 192px) { .pf-prop { display: none; } }
@container w (max-height: 150px) { .legend { display: none; } }

/* =========================================================
   8. Dock e icone
   ========================================================= */
.dock {
  position: fixed; z-index: 70; left: 50%; bottom: 10px; translate: -50% 0; --r: 26px;
  display: flex; align-items: flex-end; gap: var(--dock-gap, 6px); padding: var(--dock-pad, 7px) calc(var(--dock-pad, 7px) + 2px); max-width: calc(100vw - 12px); overflow: visible;
}
html[data-labels="1"] .dock { padding-bottom: calc(var(--dock-pad, 7px) + 14px); }
.dock-item {
  position: relative; z-index: 4; flex: none; width: calc(var(--dock-ic) * var(--s, 1)); height: var(--dock-ic);
  border: 0; padding: 0; background: none; border-radius: 12px; transition: width .2s var(--out);
}
.dock-item > .ic { --sz: var(--dock-ic); position: absolute; left: 50%; bottom: 0; transform: translateX(-50%) scale(var(--s, 1)); transform-origin: 50% 100%; transition: transform .2s var(--out); }
.dock.magnifying .dock-item, .dock.magnifying .dock-item > .ic { transition: none; }
.dock-item:focus-visible { outline-offset: 4px; }
.dock-item:active > .ic { filter: brightness(.82); }
.dock-dot { position: absolute; left: 50%; bottom: -6px; width: 4px; height: 4px; translate: -50% 0; border-radius: 50%; background: var(--wall-ink); opacity: 0; transition: opacity .2s; }
.dock-item.running .dock-dot { opacity: .8; }
html[data-labels="1"] .dock-dot { bottom: -18px; }
.dock-label { display: none; position: absolute; top: calc(100% + 4px); left: 50%; translate: -50% 0; font-size: 10px; font-weight: 500; white-space: nowrap; color: var(--ink-2); }
html[data-labels="1"] .dock-label { display: block; }
.dock-sep { width: 1px; align-self: stretch; flex: none; margin: 6px var(--dock-sepm, 3px); background: linear-gradient(transparent, var(--well-2), transparent); position: relative; z-index: 4; }
.dock-item.bounce > .ic { animation: hop .8s var(--out); }
@keyframes hop { 0%, 100% { translate: 0 0; } 25% { translate: 0 -18px; } 50% { translate: 0 0; } 70% { translate: 0 -7px; } }
.tip {
  position: fixed; z-index: 90; left: 0; top: 0; translate: -50% -100%; --r: 999px; padding: 5px 11px; pointer-events: none;
  font-size: 12px; font-weight: 600; color: var(--ink); white-space: nowrap; display: flex; align-items: center; gap: 7px;
  opacity: 0; transform: translateY(4px) scale(.95); transition: opacity .12s, transform .2s var(--out);
}
.tip.on { opacity: 1; transform: none; }
.tip kbd { padding: 2px 5px; font-size: 10.5px; position: relative; z-index: 4; }

.ic {
  --sz: 50px; position: relative; display: inline-block; flex: none; width: var(--sz); height: var(--sz); border-radius: 23.5%;
  background: linear-gradient(165deg, var(--c1), var(--c2));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .55), inset 0 0 0 .5px rgba(255, 255, 255, .22), inset 0 -1px 1px rgba(0, 0, 0, .14),
              0 calc(var(--sz) * .05) calc(var(--sz) * .14) calc(var(--sz) * -.03) rgba(0, 0, 0, .32);
}
.ic::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(170deg, rgba(255, 255, 255, .36) 0%, rgba(255, 255, 255, .07) 42%, rgba(255, 255, 255, 0) 62%);
}
.ic svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 calc(var(--sz) * .015) calc(var(--sz) * .02) rgba(0, 0, 0, .22)); }
.ic .g1 { fill: url(#lgGlass); }
.ic .g2 { fill: #fff; fill-opacity: .5; }
.ic .gs { stroke: #fff; }
.ic .g3 { fill: var(--acc, #FF3B30); }
.ic .gk { fill: #1C1C1E; }
.ic .gl { stroke: rgba(0, 0, 0, .2); fill: none; }
.ic .gt { fill: #fff; font: 800 13px/1 var(--font-r); letter-spacing: -.4px; }
.ic .gtk { fill: #1C1C1E; font: 600 7.5px/1 var(--font-r); }
.ic .gt-mon { font: 700 10.5px/1 var(--font); letter-spacing: .08em; }
.ic .gt-day { font: 300 30px/1 var(--font-d); letter-spacing: -1px; }
.ic .gw { fill: #fff; }
.ic .gws { stroke: #fff; }
.ic-light .gs { stroke: rgba(0, 0, 0, .24); }
html[data-icons="dark"] .ic { background: linear-gradient(165deg, #3B3C43, #141418); }
html[data-icons="dark"] .ic::after { background: linear-gradient(170deg, rgba(255, 255, 255, .15), rgba(255, 255, 255, 0) 50%); }
html[data-icons="dark"] .ic .g1 { fill: var(--hue); }
html[data-icons="dark"] .ic .g2 { fill: var(--hue); fill-opacity: .42; }
html[data-icons="dark"] .ic .gs, html[data-icons="dark"] .ic-light .gs { stroke: var(--hue); }
html[data-icons="dark"] .ic .gk, html[data-icons="dark"] .ic .gtk { fill: #fff; }
html[data-icons="dark"] .ic .gl { stroke: rgba(255, 255, 255, .28); }
html[data-icons="dark"] .ic .gt { fill: var(--hue); }
html[data-icons="clear"] .ic {
  background: linear-gradient(165deg, rgba(255, 255, 255, .5), rgba(255, 255, 255, .14));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .9), inset 0 0 0 1px rgba(255, 255, 255, .35), inset 0 -1px 2px rgba(0, 0, 0, .08),
              0 calc(var(--sz) * .05) calc(var(--sz) * .14) calc(var(--sz) * -.04) rgba(0, 0, 0, .25);
}
html[data-icons="clear"] .ic .g1, html[data-icons="clear"] .ic .gk, html[data-icons="clear"] .ic .gtk, html[data-icons="clear"] .ic .gt { fill: var(--clear-ink); }
html[data-icons="clear"] .ic .g2 { fill: var(--clear-ink); fill-opacity: .4; }
html[data-icons="clear"] .ic .g3 { fill: var(--clear-ink); fill-opacity: .72; }
html[data-icons="clear"] .ic .gs, html[data-icons="clear"] .ic-light .gs { stroke: var(--clear-ink); }
html[data-icons="clear"] .ic .gl { stroke: var(--clear-line); }
html[data-scheme="light"] { --clear-ink: rgba(20, 22, 48, .8); --clear-line: rgba(255, 255, 255, .7); }
html[data-scheme="dark"] { --clear-ink: rgba(255, 255, 255, .95); --clear-line: rgba(0, 0, 0, .3); }
html[data-scheme="dark"][data-icons="clear"] .ic { background: linear-gradient(165deg, rgba(255, 255, 255, .26), rgba(255, 255, 255, .06)); }

/* =========================================================
   9. Finestre interne
   ========================================================= */
.wins { position: fixed; inset: 0; z-index: 40; pointer-events: none; }
.win {
  position: absolute; pointer-events: auto; display: flex; flex-direction: column; min-width: 380px; min-height: 260px;
  border-radius: var(--r-win); background: var(--win-fill); outline: none; overflow: hidden;
  -webkit-backdrop-filter: blur(28px) saturate(1.7); backdrop-filter: blur(28px) saturate(1.7);
  box-shadow: 0 34px 80px -24px rgba(0, 0, 0, .5), 0 10px 30px -12px rgba(0, 0, 0, .25), 0 0 0 .5px rgba(0, 0, 0, .2),
              inset 0 0 0 .5px var(--g-edge), inset 0 1px 0 var(--g-hi);
}

.toast { position: fixed; z-index: 95; left: 50%; bottom: calc(var(--dock-space) + 4px); translate: -50% 0; --r: 999px; padding: 10px 18px; font-weight: 500; pointer-events: none; opacity: 0; transform: translateY(8px) scale(.97); transition: opacity .2s, transform .35s var(--spring); max-width: calc(100vw - 32px); }
.toast.on { opacity: 1; transform: none; }
.dtip {
  position: fixed; z-index: 96; left: 0; top: 0; padding: 6px 10px; border-radius: 10px; font-size: 12px; font-weight: 500; color: var(--ink);
  background: var(--tip-bg); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); pointer-events: none; opacity: 0; transition: opacity .12s;
  box-shadow: 0 6px 20px -8px rgba(0, 0, 0, .35), inset 0 0 0 .5px var(--chip-edge); white-space: nowrap;
}
.dtip.on { opacity: 1; }

/* =========================================================
   11. Schermata di benvenuto (blocco)
   ========================================================= */
.lock { position: fixed; inset: 0; z-index: 200; display: none; flex-direction: column; align-items: center; padding: 8vh 24px 5vh; color: var(--lk-ink); text-align: center; }
html.locked .lock { display: flex; }
html.locked .desk, html.locked .dock, html.locked .bar, html.locked .wins, html.locked .tip { visibility: hidden; }
.lk-date { font: 600 22px/1.2 var(--font-d); text-shadow: 0 1px 14px rgba(0, 0, 0, .18); }
.lk-time {
  font: 700 clamp(96px, 16vw, 188px)/.95 var(--font-r); letter-spacing: -.035em; font-variant-numeric: tabular-nums; margin-top: 4px;
  color: transparent; -webkit-background-clip: text; background-clip: text;
  background-image: linear-gradient(180deg, color-mix(in srgb, var(--lk-ink) 96%, transparent), color-mix(in srgb, var(--lk-ink) 52%, transparent));
  filter: drop-shadow(0 2px 18px rgba(30, 20, 90, .22));
}
.lk-brand { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: auto; }
.lk-brand b { font: 700 20px/1.1 var(--font-d); letter-spacing: -.01em; }
.lk-brand span { font-size: 13px; opacity: .75; }
.lk-slide { --r: 999px; position: relative; width: min(340px, 86vw); height: 60px; margin-top: 28px; display: flex; align-items: center; padding: 5px; }
.lk-hint {
  position: absolute; inset: 0; z-index: 4; display: grid; place-items: center; padding-left: 40px; font-size: 15px; font-weight: 500; pointer-events: none;
  color: transparent; -webkit-background-clip: text; background-clip: text;
  background-image: linear-gradient(100deg, var(--ink-2) 40%, var(--ink) 50%, var(--ink-2) 60%); background-size: 300% 100%;
  animation: shimmer 3.2s linear infinite; opacity: calc(1 - var(--p, 0) * 1.6);
}
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
.lk-knob {
  position: relative; z-index: 5; width: 50px; height: 50px; border-radius: 50%; border: 0; display: grid; place-items: center; touch-action: none;
  background: var(--thumb); color: var(--ink); box-shadow: 0 4px 14px -2px rgba(0, 0, 0, .3), inset 0 1px 0 rgba(255, 255, 255, .85), inset 0 0 0 .5px var(--chip-edge);
  transition: transform .45s var(--spring), width .2s;
}
.lk-knob.drag { transition: width .2s; width: 58px; }
.lk-knob svg { width: 16px; height: 16px; }
.lk-alt { margin-top: 14px; border: 0; background: none; color: inherit; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; opacity: .85; }
.lk-note { margin-top: 6px; font-size: 11.5px; opacity: .7; }

/* =========================================================
   12. Schermi stretti, movimento ridotto
   ========================================================= */
@media (max-width: 1100px) {
  .board { flex: none; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: 300px 64px 300px 270px; grid-template-areas: "ag cl" "ag ev" "td sc" "pf pf"; }
}
@media (max-width: 760px) {

  .board { grid-template-columns: minmax(0, 1fr); grid-template-rows: 330px 310px 64px 300px 280px 250px; grid-template-areas: "ag" "cl" "ev" "td" "sc" "pf"; }
  .hero h1 { font-size: 28px; }
  .bar-clock, .bt-search span, .bt-search kbd, .bar-app { display: none; }
  .win-grid { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .side { margin: 8px 8px 0; max-height: 34vh; }
  .no-side .tbar, .tbar { padding-left: 96px; }
  .win-grid:not(.no-side) .tbar { padding-left: 18px; }
  .pad { padding: 2px 14px 20px; }
}
/* Movimento organico degli sfondi: lento, continuo e mai invasivo. */
.wp-acqua > ellipse, .wp-acqua .aq-drop {
  transform-box: fill-box;
  transform-origin: center;
  will-change: transform;
}
.wp-acqua > ellipse:nth-of-type(1) { animation: aqua-haze-a 28s ease-in-out infinite alternate; }
.wp-acqua > ellipse:nth-of-type(2) { animation: aqua-haze-b 34s ease-in-out infinite alternate; }
.wp-acqua .aq-drop-one { animation: aqua-drop-a 31s ease-in-out infinite alternate; }
.wp-acqua .aq-drop-two { animation: aqua-drop-b 37s ease-in-out -12s infinite alternate; }
.wp-acqua .aq-drop-three { animation: aqua-drop-c 42s ease-in-out -23s infinite alternate; }
.wp-acqua .aq-rays { transform-origin: 50% 0; animation: aqua-rays 24s ease-in-out infinite alternate; }
.wp-acqua .ac { animation: aqua-caustics 13s ease-in-out infinite alternate; }
@keyframes aqua-haze-a {
  0% { transform: translate(-45px, 5px) scale(.96, 1.03); }
  48% { transform: translate(55px, 72px) scale(1.07, .93); }
  100% { transform: translate(-15px, 125px) scale(1.02, 1.1); }
}
@keyframes aqua-haze-b {
  0% { transform: translate(-80px, 30px) scale(1.06, .94); }
  52% { transform: translate(70px, -85px) scale(.94, 1.08); }
  100% { transform: translate(165px, -35px) scale(1.08, 1.02); }
}
@keyframes aqua-drop-a {
  0% { transform: translate(-70px, -35px) scale(.88, 1.08); opacity: .18; }
  50% { transform: translate(85px, 90px) scale(1.12, .93); opacity: .3; }
  100% { transform: translate(175px, 15px) scale(.96, 1.13); opacity: .2; }
}
@keyframes aqua-drop-b {
  0% { transform: translate(80px, 60px) scale(1.08, .9); opacity: .14; }
  50% { transform: translate(-85px, -75px) scale(.9, 1.1); opacity: .27; }
  100% { transform: translate(-165px, 45px) scale(1.1, 1.02); opacity: .18; }
}
@keyframes aqua-drop-c {
  0% { transform: translate(-40px, 80px) scale(.93, 1.05); opacity: .1; }
  55% { transform: translate(100px, -60px) scale(1.13, .92); opacity: .22; }
  100% { transform: translate(15px, -140px) scale(1, 1.12); opacity: .13; }
}
@keyframes aqua-rays {
  from { transform: translateX(-35px) skewX(-2deg); opacity: .65; }
  to { transform: translateX(55px) skewX(3deg); opacity: 1; }
}
@keyframes aqua-caustics { from { opacity: calc(var(--aqc) * .65); } to { opacity: var(--aqc); } }
.wp-laguna { background-size: 130% 130%; animation: laguna-drift 32s ease-in-out infinite alternate; }
@keyframes laguna-drift { from { background-position: 0% 0%; } to { background-position: 65% 45%; } }
#wp-drops > g { animation: goccia-deriva 18s ease-in-out infinite alternate; will-change: translate; }
#wp-drops > g:nth-child(3n) { animation-duration: 23s; animation-delay: -8s; }
#wp-drops > g:nth-child(4n) { animation-duration: 28s; animation-delay: -15s; animation-direction: alternate-reverse; }
#wp-drops > g:nth-child(5n) { animation-duration: 34s; animation-delay: -21s; }
@keyframes goccia-deriva { from { translate: -7px -13px; } to { translate: 13px 21px; } }
/* Gocce liquide in primo piano sul wallpaper: movimento ampio e percepibile. */
.liquid-drops { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
html:not([data-wall="acqua"]) .liquid-drops { display: none; }
.liquid-drop {
  position: absolute; display: block; width: 34vw; height: 29vw; min-width: 360px; min-height: 310px;
  border-radius: 43% 57% 62% 38% / 48% 42% 58% 52%;
  filter: blur(34px); opacity: .58; will-change: transform, border-radius;
}
.liquid-drop-a {
  left: -8%; top: -15%;
  background: radial-gradient(ellipse at 58% 58%, rgba(220,248,255,.96) 0%, rgba(132,205,242,.7) 35%, rgba(116,151,235,.28) 62%, transparent 75%);
  animation: liquid-a 19s ease-in-out infinite alternate;
}
.liquid-drop-b {
  right: -9%; top: 5%; width: 38vw; height: 33vw;
  background: radial-gradient(ellipse at 42% 45%, rgba(255,244,252,.94) 0%, rgba(226,174,230,.62) 36%, rgba(140,169,237,.3) 61%, transparent 74%);
  animation: liquid-b 23s ease-in-out -8s infinite alternate;
}
.liquid-drop-c {
  left: 31%; bottom: -29%; width: 42vw; height: 31vw;
  background: radial-gradient(ellipse at 50% 38%, rgba(217,251,255,.85) 0%, rgba(111,197,229,.62) 37%, rgba(100,132,217,.3) 62%, transparent 75%);
  animation: liquid-c 27s ease-in-out -14s infinite alternate;
}
.liquid-drop-d {
  left: 18%; top: 29%; width: 24vw; height: 25vw; opacity: .35;
  background: radial-gradient(ellipse, rgba(255,255,255,.85), rgba(160,211,245,.42) 43%, transparent 70%);
  animation: liquid-d 21s ease-in-out -5s infinite alternate;
}
@keyframes liquid-a {
  0% { transform: translate(-5vw,-3vh) rotate(-8deg) scale(.94); border-radius: 43% 57% 62% 38% / 48% 42% 58% 52%; }
  48% { transform: translate(22vw,16vh) rotate(12deg) scale(1.12,.92); border-radius: 58% 42% 45% 55% / 38% 56% 44% 62%; }
  100% { transform: translate(48vw,5vh) rotate(25deg) scale(1.02,1.13); border-radius: 37% 63% 54% 46% / 57% 39% 61% 43%; }
}
@keyframes liquid-b {
  0% { transform: translate(4vw,-8vh) rotate(8deg) scale(1.04); border-radius: 55% 45% 38% 62% / 43% 60% 40% 57%; }
  50% { transform: translate(-23vw,21vh) rotate(-15deg) scale(.91,1.12); border-radius: 39% 61% 57% 43% / 59% 38% 62% 41%; }
  100% { transform: translate(-46vw,7vh) rotate(-24deg) scale(1.1,.96); border-radius: 61% 39% 46% 54% / 36% 54% 46% 64%; }
}
@keyframes liquid-c {
  0% { transform: translate(-18vw,4vh) rotate(-8deg) scale(1.05,.94); }
  50% { transform: translate(8vw,-29vh) rotate(13deg) scale(.93,1.13); }
  100% { transform: translate(30vw,-12vh) rotate(24deg) scale(1.13,1.02); }
}
@keyframes liquid-d {
  from { transform: translate(-12vw,12vh) rotate(-15deg) scale(.85); }
  to { transform: translate(35vw,-20vh) rotate(22deg) scale(1.18); }
}
.orb::before { background: conic-gradient(from 0deg,#564BA9,#8B72E8,#D6B5FF,#7472DE,#A68CF2,#564BA9); }
.orb::after { z-index: 1; }
.orb > svg { position: absolute; z-index: 2; inset: 22%; width: 56%; height: 56%; color: #fff; fill: currentColor; filter: drop-shadow(0 1px 3px rgba(44,27,107,.25)); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

function gearPath(cx, cy, R, r, n, h) {
  const p = (a, rad) => (cx + Math.cos(a) * rad).toFixed(2) + ' ' + (cy + Math.sin(a) * rad).toFixed(2);
  const st = Math.PI * 2 / n, tw = st * .24, bw = st * .34;
  let d = '';
  for (let i = 0; i < n; i++) {
    const c = i * st - Math.PI / 2;
    d += (i ? 'L' : 'M') + p(c - bw, r) + 'L' + p(c - tw, R) + 'L' + p(c + tw, R) + 'L' + p(c + bw, r);
    d += 'A' + r + ' ' + r + ' 0 0 1 ' + p((i + 1) * st - Math.PI / 2 - bw, r);
  }
  return d + 'Z M' + (cx + h) + ' ' + cy + 'a' + h + ' ' + h + ' 0 1 0 ' + (-2 * h) + ' 0a' + h + ' ' + h + ' 0 1 0 ' + (2 * h) + ' 0z';
}

const premioAnnuo = p => p.premio ? (p.freq === 'm' ? p.premio * 12 : p.premio) : 0;

  const r = { att: 0, deb: 0, premi: 0, capitale: 0, nProp: 0, valProp: 0, perCanale: { alleanza: 0, indipendente: 0 }, inScad: [] };
  for (const p of list) {
    if (p.stato === 'essere') {
      if (p.area === 'debiti') r.deb += p.valore || 0;
      else { r.att += p.valore || 0; r.perCanale[p.canale] += p.valore || 0; r.premi += premioAnnuo(p); }
      if (p.area === 'protezione') r.capitale += p.capitale || 0;
      if (p.scad && diffDays(p.scad) <= 90) r.inScad.push(p);
    } else { r.nProp++; r.valProp += (p.versamento || 0) + premioAnnuo(p); }
  }
  r.netto = r.att - r.deb;
  r.inScad.sort((a, b) => a.scad - b.scad);
  return r;
}

/* ---------- Rifrazione dei bordi (solo Chromium: backdrop-filter con filtro SVG) ---------- */
const Refract = {
  ok: false, ready: false, items: new Map(), n: 0, timer: {},
  init() {
    const ua = navigator.userAgent;
    this.ok = /(Chrome|Chromium|Edg)\//.test(ua) && !/(Firefox|FxiOS|CriOS)\//.test(ua) && CSS.supports('backdrop-filter', 'url(#a)');
    this.defs = $('#rf-defs'); this.ready = true;
    if (!this.ok || !window.ResizeObserver) { this.ok = false; return; }
    this.ro = new ResizeObserver(en => en.forEach(e => this.later(e.target)));
  },
  watch(el, opt) { if (!this.ok || this.items.has(el)) return; this.items.set(el, { id: 'rf' + (++this.n), opt: opt, w: 0, h: 0 }); this.ro.observe(el); },
  later(el) { clearTimeout(this.timer[this.items.get(el).id]); this.timer[this.items.get(el).id] = setTimeout(() => this.update(el, true), 90); },
  map(w, h, r, band) {
    const c = doc.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d'), img = ctx.createImageData(w, h), d = img.data;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const px = x + .5 - w / 2, py = y + .5 - h / 2, qx = Math.abs(px) - (w / 2 - r), qy = Math.abs(py) - (h / 2 - r);
      const dist = r - Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) - Math.min(Math.max(qx, qy), 0);
      let nx = 0, ny = 0;
      if (dist >= 0 && dist < band) {
        if (qx > 0 && qy > 0) { const l = Math.hypot(qx, qy) || 1; nx = Math.sign(px) * qx / l; ny = Math.sign(py) * qy / l; }
        else if (qx > qy) nx = Math.sign(px); else ny = Math.sign(py);
        const m = Math.pow(1 - dist / band, 2); nx *= m; ny *= m;
      }
      const i = (y * w + x) * 4; d[i] = 128 - nx * 127; d[i + 1] = 128 - ny * 127; d[i + 2] = 128; d[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0); return c.toDataURL();
  },
  update(el, force) {
    const it = this.items.get(el); if (!it) return;
    if (!S.refract) { el.style.removeProperty('--g-filter'); it.w = 0; return; }
    const w = Math.round(el.offsetWidth), h = Math.round(el.offsetHeight); if (!w || !h) return;
    if (!force && w === it.w && h === it.h) return;
    it.w = w; it.h = h;
    const r = Math.min(parseFloat(getComputedStyle(el).borderTopLeftRadius) || 20, h / 2, w / 2);
    let f = this.defs.querySelector('#' + it.id);
    if (!f) { f = doc.createElementNS('http://www.w3.org/2000/svg', 'filter'); f.id = it.id; this.defs.appendChild(f); }
    f.setAttribute('x', '0'); f.setAttribute('y', '0'); f.setAttribute('width', w); f.setAttribute('height', h);
    f.setAttribute('filterUnits', 'userSpaceOnUse'); f.setAttribute('color-interpolation-filters', 'sRGB');
    f.innerHTML = '<feImage href="' + this.map(w, h, r, it.opt.band) + '" x="0" y="0" width="' + w + '" height="' + h + '" preserveAspectRatio="none" result="m"/>' +
      '<feDisplacementMap in="SourceGraphic" in2="m" scale="' + it.opt.scale + '" xChannelSelector="R" yChannelSelector="G"/>';
    el.style.setProperty('--g-filter', 'url(#' + it.id + ') ' + (it.opt.thin ? 'blur(calc(var(--g-blur) * .5))' : 'blur(var(--g-blur))') + ' saturate(var(--g-sat)) brightness(var(--g-bright))');
  },
  sync() { this.items.forEach((it, el) => this.update(el, true)); }
};

  toast: el => toast(el.dataset.msg),
  backup: () => toast('Backup creato. Le ultime 8 copie restano nella cartella scelta.'),
  set: el => setSetting(el.dataset.key, el.dataset.val),
  toggle: el => toggleSetting(el.dataset.key),
  focus: el => { S.focus = el.dataset.client; saveS(); closeOverlays(); $('#w-cl').innerHTML = wCliente(); if (WINS.has('clienti')) renderWin('clienti'); },
  task: el => {
    const t = TASKS.find(x => x.id === el.dataset.rec); if (!t) return;
    const v = !isDone(t); TASKSTATE[t.id] = v; store.set('tasks', TASKSTATE);
    $$('[data-act="task"][data-rec="' + t.id + '"]').forEach(b => { b.setAttribute('aria-checked', v); const row = b.closest('.todo'); if (row) row.classList.toggle('done', v); });
    clearTimeout(taskT);
    taskT = setTimeout(() => { $('#w-td').innerHTML = wTodo(); $('#w-cl').innerHTML = wCliente(); ['attivita', 'clienti', 'eve'].forEach(id => { if (WINS.has(id)) { if (id === 'eve') WINS.get(id).view.msgs = null; renderWin(id); } }); }, v ? 900 : 0);
  },
  view: el => {
    const w = winOf(el); if (!w) return;
    w.view[el.dataset.key] = el.dataset.val;
    if (el.dataset.also) el.dataset.also.split(',').forEach(p => { const kv = p.split(':'); w.view[kv[0]] = kv[1]; });
    if (w.id === 'eve' && el.dataset.key === 'client') w.view.msgs = null;
    renderWin(w.id);
  },
  'win-close': el => { const w = winOf(el); if (w) closeWin(w.id); },
  'win-min': el => { const w = winOf(el); if (w) minimizeWin(w.id); },
  'win-zoom': el => { const w = winOf(el); if (w) zoomWin(w.id); },
  'eve-ask': el => eveSend(el.dataset.q),
  'eve-new': el => { const w = winOf(el); if (w) { w.view.msgs = null; renderWin('eve'); } }
};
doc.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACTS[el.dataset.act];
  if (fn) fn(el, e);
});
doc.addEventListener('submit', e => {
  const f = e.target;
  if (f.dataset && f.dataset.form === 'eve') { e.preventDefault(); eveSend($('input', f).value); }
});
doc.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'spot-q') return spotRender(el.value);
  if (el.dataset.settingInput === 'name') { S.name = el.value.trim() || 'Denis'; saveS(); $('#hello').textContent = greeting() + ', ' + S.name + '.'; return; }
  const key = el.dataset.input, w = key && winOf(el); if (!w) return;
  w.view[key] = el.value;
  if (w.id === 'ricerca') { $('.rc-res', w.el).innerHTML = resultsHTML(el.value); return; }
  renderWin(w.id);
});

/* finestre: fuoco, trascinamento, ridimensionamento; pannelli: chiusura cliccando fuori */
doc.addEventListener('pointerdown', e => {
  if (anyOv() && !e.target.closest('.ov, [data-ovt], .scrim')) closeOverlays();
  const winEl = e.target.closest('.win'); if (!winEl) return;
  const w = WINS.get(winEl.dataset.win); if (!w) return;
  focusWin(w.id);
  const handle = e.target.closest('[data-drag]'), rs = e.target.closest('[data-resize]');
  if (e.button !== 0 || (!handle && !rs) || (handle && e.target.closest('button, input, label, a, [data-act]'))) return;
  e.preventDefault();
  const sx = e.clientX, sy = e.clientY, o = { x: w.x, y: w.y, w: w.w, h: w.h }, bh = cssPx('--bar-h') || 34;
  const move = ev => {
    if (rs) { w.w = Math.max(380, o.w + ev.clientX - sx); w.h = Math.max(260, o.h + ev.clientY - sy); }
    else { w.x = o.x + ev.clientX - sx; w.y = Math.max(bh + 2, o.y + ev.clientY - sy); }
    if (w.max) { w.max = false; w.el.classList.remove('max'); }
    place(w);
  };
  const up = () => { removeEventListener('pointermove', move); removeEventListener('pointerup', up); clampWin(w); place(w); };
  addEventListener('pointermove', move); addEventListener('pointerup', up);
});
doc.addEventListener('dblclick', e => { const h = e.target.closest('.tbar'); if (h && !e.target.closest('button, input')) { const w = winOf(h); if (w) zoomWin(w.id); } });

doc.addEventListener('keydown', e => {
  if (root.classList.contains('locked')) return;
  const k = e.key;
  if ((e.metaKey || e.ctrlKey) && (k === 'k' || k === 'K')) { e.preventDefault(); if ($('#spot').hidden) openSpot(); else closeOverlays(); return; }
  if (k === 'Escape') { if (anyOv()) { e.preventDefault(); closeOverlays(); } return; }
  if (!$('#spot').hidden) {
    if ((k === 'ArrowDown' || k === 'ArrowUp') && spotItems.length) { e.preventDefault(); spotSel = (spotSel + (k === 'ArrowDown' ? 1 : -1) + spotItems.length) % spotItems.length; markSel(); return; }
    if (k === 'Enter' && e.target.id === 'spot-q') { e.preventDefault(); if (spotItems[spotSel]) spotItems[spotSel].click(); return; }
  }
  const typing = e.target.closest && e.target.closest('input, textarea, select');
  if (e.altKey && !e.metaKey && !e.ctrlKey && !typing && /^Digit\d$/.test(e.code)) {
    e.preventDefault(); const n = +e.code.slice(5);
    if (n === 0) showDesk(); else if (APPS[n - 1]) openApp(APPS[n - 1].id);
  }
});

/* luce che segue il puntatore sul vetro */
let sheenEl = null, sheenRAF = 0, sheenEv = null;
doc.addEventListener('pointermove', e => {
  sheenEv = e;
  if (!sheenRAF) sheenRAF = requestAnimationFrame(() => {
    sheenRAF = 0; const ev = sheenEv;
    const g = ev.target.closest ? ev.target.closest('.glass') : null;
    if (g !== sheenEl) { if (sheenEl) { sheenEl.style.removeProperty('--mx'); sheenEl.style.removeProperty('--my'); } sheenEl = g; }
    if (!g) return;
    const r = g.getBoundingClientRect();
    g.style.setProperty('--mx', ((ev.clientX - r.left) / r.width * 100).toFixed(1) + '%');
    g.style.setProperty('--my', ((ev.clientY - r.top) / r.height * 100 - 45).toFixed(1) + '%');
  });
}, { passive: true });

/* suggerimenti sui grafici */
const dtip = $('#dtip');
doc.addEventListener('pointerover', e => { const t = e.target.closest && e.target.closest('[data-tip]'); if (t) { dtip.textContent = t.dataset.tip; dtip.classList.add('on'); } });
doc.addEventListener('pointerout', e => { const t = e.target.closest && e.target.closest('[data-tip]'); if (t && !t.contains(e.relatedTarget)) dtip.classList.remove('on'); });
doc.addEventListener('pointermove', e => { if (dtip.classList.contains('on')) { dtip.style.left = (e.clientX + 12) + 'px'; dtip.style.top = (e.clientY - 36) + 'px'; } }, { passive: true });

/* cursore della schermata di benvenuto */
(() => {
  const knob = $('#lk-knob'), track = $('#lk-slide'); let sx = 0, dx = 0, max = 0, drag = false;
  knob.addEventListener('pointerdown', e => { drag = true; sx = e.clientX; dx = 0; max = track.clientWidth - knob.offsetWidth - 10; knob.setPointerCapture(e.pointerId); knob.classList.add('drag'); });
  knob.addEventListener('pointermove', e => { if (!drag) return; dx = Math.max(0, Math.min(max, e.clientX - sx)); knob.style.transform = 'translateX(' + dx + 'px)'; track.style.setProperty('--p', (dx / max).toFixed(3)); });
  const end = () => { if (!drag) return; drag = false; knob.classList.remove('drag'); const go = dx > max * .8; knob.style.transform = ''; track.style.setProperty('--p', 0); if (go) unlock(); };
  knob.addEventListener('pointerup', end); knob.addEventListener('pointercancel', end);
  knob.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight') { e.preventDefault(); unlock(); } });
})();

doc.addEventListener('fullscreenchange', () => { $('#full-l').textContent = doc.fullscreenElement ? 'Esci da schermo intero' : 'Schermo intero'; });
addEventListener('resize', () => {
  fitDock();
  WINS.forEach(w => { if (w.max) { const r = deskRect(); Object.assign(w, { x: r.x, y: r.y, w: r.w, h: r.h }); } clampWin(w); place(w); });
  if (!$('#pop').hidden) closeOverlays();
});

/* ---------- Avvio ---------- */
function paintClock() {
  const d = new Date();
  $('#bar-date').textContent = fBar.format(d).replace(/\./g, '');
  $('#bar-time').textContent = fTime.format(d);
  const h = $('#hello'), t = greeting() + ', ' + S.name + '.'; if (h.textContent !== t) h.textContent = t;
  if (root.classList.contains('locked')) paintLock();
}
function boot() {
  fillGlyphs(doc);
  $('#lk-brand').innerHTML = icon('home', 64) + '<b>Prisma</b><span>Financial Desk</span>';
  applySettings();
  buildDock();
  fitDock();
  renderDesk();
  paintChrome(); paintBadge(); paintClock();
  setInterval(paintClock, 15000);
  Refract.init();
  if (Refract.ok) {
    Refract.watch(dock, { band: 14, scale: 26, thin: true });
    Refract.watch($('#bar-tools'), { band: 9, scale: 14, thin: true });
    $$('.gbtn').forEach(b => Refract.watch(b, { band: 10, scale: 16, thin: true }));
    $$('.widget').forEach(b => Refract.watch(b, { band: 18, scale: 30 }));
    Refract.watch($('#lk-slide'), { band: 14, scale: 24, thin: true });
  }
  if (!calm()) $$('.widget').forEach((w, i) => w.animate([{ opacity: 0, transform: 'translateY(14px) scale(.985)' }, { opacity: 1, transform: 'none' }], { duration: 560, delay: 60 + i * 45, easing: 'cubic-bezier(.22,1,.36,1)', fill: 'backwards' }));
}
boot();

/* Aggancio per eventuali prove automatiche: nessun effetto sull'uso normale */
window.PrismaLG = { openApp: openApp, openSpot: openSpot, toggleCC: toggleCC, toggleNC: toggleNC, lock: lock, unlock: unlock, set: setSetting, refract: Refract };
})();
</script>
</body>
</html>
